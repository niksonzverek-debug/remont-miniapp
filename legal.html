*{box-sizing:border-box}body{margin:0;background:#081522;color:#e6f5ff;font:15px/1.65 system-ui,Arial,sans-serif}.wrap{max-width:790px;margin:auto;padding:24px 18px 70px}.hero{text-align:center;padding:25px 0}.hero img{width:80px}.card{background:#10273b;border:1px solid #245b7a;border-radius:16px;padding:19px;margin:16px 0}h1{font-size:25px}h2{font-size:18px;color:#81dbff}p,li{color:#d5e6f0}button{background:#166fc3;color:#fff;border:0;padding:10px 17px;border-radius:10px;cursor:pointer}.muted{color:#adc5d7;font-size:13px}.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.tabs button[aria-pressed="true"]{background:#39a5ed;box-shadow:0 0 0 2px #9fe6ff inset;font-weight:700}.notice{border-left:3px solid #50b9ed;padding-left:13px}a{color:#7ed9ff}
</style></head><body><div class="wrap"><header class="hero"><img src="img/remont-bt-icon.png" alt="ТехСервис"><h1 id="heading">🛡 Правовая информация</h1><p class="muted" id="revision">ТехСервис · Редакция 2026-11-04-v1</p><div class="tabs" role="group" aria-label="Language"><button type="button" data-lang="ru">Русский</button><button type="button" data-lang="uz">O‘zbekcha</button><button type="button" data-lang="en">English</button></div></header><main id="content"></main></div><script>
const docs={ru:[
['Назначение сервиса','ТехСервис — цифровая платформа для заявок, общения, оформления электронных актов, скидок и учёта услуг. Оператор предоставляет программные инструменты и не выполняет ремонт от имени независимых мастеров, если прямо не указано иное.'],
['Мастер и клиент','Условия ремонта, цена, сроки, оплата и гарантии согласуются между мастером и клиентом. Мастер самостоятельно отвечает за качество и безопасность работ, исполнение гарантийных обязательств, расчётные документы, законность своей деятельности и уплату налогов. Клиент отвечает за достоверность предоставленных сведений и исполнение согласованных обязательств.'],
['Ответственность оператора','Оператор не является стороной договора ремонта между независимым мастером и клиентом и не гарантирует результат работы мастера. Это не ограничивает ответственность оператора за собственные услуги, нарушения закона, обработку данных и обязательства, которые нельзя исключить соглашением.'],
['Вознаграждение и депозит','Использование платформы мастерами является платным. Комиссия рассчитывается по действующему тарифу от стоимости оформленного акта. Внутренний депозит предназначен для учёта авансов и списания вознаграждения за услуги платформы; он не является оплатой ремонта клиентом. Конкретные тарифы и порядок возврата неиспользованного остатка должны быть опубликованы отдельно.'],
['Акты и отметки об оплате','Электронный акт формируется на основе сведений пользователей. Подтверждение акта и отметка «Оплачено» фиксируют действия соответствующих лиц и не являются независимой проверкой оператором фактического ремонта или получения денег.'],
['Споры','Стороны сначала решают разногласия непосредственно. Они вправе обращаться в уполномоченные органы или суд в порядке, установленном законом. Платформа может предоставить предусмотренные законом сведения, но не обязана разрешать спор вместо суда или компетентного органа.'],
['Проверка личности','Отметка «Личность проверена» означает прохождение внутренней процедуры проверки документов, а не государственную сертификацию, лицензию или гарантию квалификации и качества ремонта.'],
['Персональные данные','Для работы платформы могут обрабатываться Telegram ID, телефон, имя, адрес, история заявок, актов и сообщений, а при добровольной идентификации — изображения документов и селфи. Данные используются для предоставления сервиса, поддержки, безопасности и исполнения законных обязанностей. Доступ ограничивается по ролям. Сроки хранения, способы удаления, сведения об операторе и законные основания обработки необходимо определить в отдельной полной политике конфиденциальности. Для обработки, требующей отдельного согласия, оно запрашивается отдельно.'],
['Изменения условий','При существенном изменении условий может потребоваться повторное подтверждение новой редакции. Дата и версия принятого документа фиксируются в системе.']
],uz:[
['Platformaning vazifasi','TehServis — buyurtmalar, muloqot, elektron dalolatnomalar va hisob-kitob vositalari uchun raqamli platforma. Operator mustaqil ustalar nomidan ta’mirlash ishlarini bajarmaydi, agar boshqacha aniq ko‘rsatilmagan bo‘lsa.'],
['Usta va mijoz','Ta’mirlash narxi, muddati, to‘lov va kafolat shartlari usta hamda mijoz o‘rtasida kelishiladi. Usta ish sifati, xavfsizligi, kafolat, soliq va qonuniy majburiyatlari uchun mustaqil javobgar.'],
['Operator javobgarligi','Operator mustaqil usta va mijoz o‘rtasidagi ta’mirlash shartnomasining tomoni emas va usta ishining natijasini kafolatlamaydi. Biroq operator o‘z xizmatlari va qonun bo‘yicha majburiyatlari uchun javobgar.'],
['Komissiya va depozit','Platformadan foydalanish pullik. Komissiya amaldagi tarif bo‘yicha dalolatnoma summasidan hisoblanadi. Ichki depozit platforma xizmatlari uchun avans va komissiyalarni hisobga olishga xizmat qiladi, mijozning ta’mirlash to‘lovi emas. Qolgan mablag‘ni qaytarish tartibi alohida e’lon qilinishi lozim.'],
['Dalolatnomalar va to‘lov','Elektron dalolatnoma foydalanuvchilar kiritgan ma’lumotlar asosida tuziladi. Tasdiqlash va «To‘langan» belgisi operator tomonidan ta’mirlash yoki to‘lov mustaqil tekshirilganini bildirmaydi.'],
['Nizolar','Usta va mijoz nizolarni o‘zaro yoki qonunda belgilangan tartibda vakolatli organlar va sud orqali hal qiladi.'],
['Shaxsni tekshirish','«Shaxsi tekshirilgan» belgisi ichki tekshiruvni bildiradi; bu davlat sertifikati yoki ish sifati kafolati emas.'],
['Shaxsiy ma’lumotlar','Telegram ID, telefon, ism, manzil, buyurtma va dalolatnomalar ma’lumotlari qayta ishlanishi mumkin. Ixtiyoriy tekshiruvda hujjat rasmlari va selfi olinishi mumkin. Ma’lumotlardan xizmat ko‘rsatish, xavfsizlik va qonuniy majburiyatlar uchun foydalaniladi. Saqlash muddati, o‘chirish tartibi va operator ma’lumotlari to‘liq maxfiylik siyosatida belgilanishi kerak. Alohida rozilik zarur bo‘lsa, u alohida olinadi.'],
['Shartlar o‘zgarishi','Muhim o‘zgarishlar uchun yangi tahrirga qayta rozilik so‘ralishi mumkin. Tasdiqlangan tahrir va vaqt tizimda qayd etiladi.']
],en:[["Purpose of the service", "TehServis is a digital platform for service requests, communication, electronic service reports, discounts and service records. The operator provides software tools and does not carry out repairs on behalf of independent technicians unless expressly stated otherwise."], ["Technician and customer", "Repair terms, prices, deadlines, payment and warranties are agreed directly between the technician and the customer. Technicians are independently responsible for work quality and safety, warranty obligations, receipts, lawful business activity and taxes. Customers are responsible for the accuracy of information they provide and for meeting agreed obligations."], ["Operator liability", "The operator is not a party to the repair agreement between an independent technician and a customer and does not guarantee the technician’s results. This does not exclude the operator’s liability for its own services, legal violations, personal data processing or obligations that cannot legally be waived."], ["Fees and deposit", "Use of the platform by technicians is paid. Commission is calculated at the applicable rate based on the value of an issued service report. The internal deposit records advances and charges for platform services; it is not the customer’s repair payment. Current rates and the procedure for returning unused balances must be published separately."], ["Service reports and payment status", "Electronic service reports are generated from information provided by users. Report confirmation and a “Paid” status record the relevant users’ actions and do not constitute independent verification by the operator that repairs were completed or payment received."], ["Disputes", "The parties should first attempt to resolve disagreements directly. They may contact competent authorities or courts in accordance with applicable law. The platform may provide information as required by law but is not obliged to resolve disputes in place of a court or competent authority."], ["Identity verification", "The “Identity reviewed” badge indicates an internal document review, not government certification, a professional licence or a guarantee of skill or repair quality."], ["Personal data", "The platform may process Telegram IDs, phone numbers, names, addresses, request and service report histories and messages; voluntary identity verification may also involve identity document images and selfies. Data is used to provide the service, maintain security and meet legal obligations. Access is role-restricted. Retention periods, deletion procedures, operator details and lawful bases for processing must be specified in a separate full privacy policy. Separate consent is requested when required."], ["Changes to terms", "Material changes to the terms may require acceptance of a new version. The accepted version and time of acceptance are recorded in the system."]]};function lang(code){if(!docs[code])code='ru';try{localStorage.setItem('remont_bt_lang',code)}catch(_){ }document.documentElement.lang=code;document.title=code==='en'?'TehServis — Legal information':code==='uz'?'TehServis — Huquqiy maʼlumot':'ТехСервис — Правовая информация';document.getElementById('revision').textContent=code==='uz'?'TehServis · 2026-11-04-v1 tahriri':code==='en'?'TehServis · Version 2026-11-04-v1':'ТехСервис · Редакция 2026-11-04-v1';document.querySelectorAll('[data-lang]').forEach(button=>{button.setAttribute('aria-pressed',String(button.dataset.lang===code));});document.getElementById('heading').textContent=code==='uz'?'🛡 Huquqiy ma’lumot':code==='en'?'🛡 Legal information':'🛡 Правовая информация';document.getElementById('content').replaceChildren(...docs[code].map(([title,body])=>{const section=document.createElement('section');section.className='card';const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=body;section.append(h,p);return section;}));}document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>lang(button.dataset.lang)));let initial='ru';try{initial=localStorage.getItem('remont_bt_lang')||'ru'}catch(_){ }lang(initial);</script></body></html>
