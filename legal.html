const docs={ru:[
['Назначение сервиса','ТехСервис — цифровая платформа для заявок, общения, оформления электронных актов, скидок и учёта услуг. Оператор предоставляет программные инструменты и не выполняет ремонт от имени независимых мастеров, если прямо не указано иное.'],
['Мастер и клиент','Условия ремонта, цена, сроки, оплата и гарантии согласуются между мастером и клиентом. Мастер самостоятельно отвечает за качество и безопасность работ, исполнение гарантийных обязательств, расчётные документы, законность своей деятельности и уплату налогов. Клиент отвечает за достоверность предоставленных сведений и исполнение согласованных обязательств.'],
['Ответственность оператора','Оператор не является стороной договора ремонта между независимым мастером и клиентом и не гарантирует результат работы мастера. Это не ограничивает ответственность оператора за собственные услуги, нарушения закона, обработку данных и обязательства, которые нельзя исключить соглашением.'],
['Вознаграждение и депозит','Использование платформы мастерами является платным. Комиссия рассчитывается по действующему тарифу от стоимости оформленного акта. Внутренний депозит предназначен для учёта авансов и списания вознаграждения за услуги платформы; он не является оплатой ремонта клиентом. Конкретные тарифы и порядок возврата неиспользованного остатка должны быть опубликованы отдельно.'],
['Акты и отметки об оплате','Электронный акт формируется на основе сведений пользователей. Подтверждение акта и отметка «Оплачено» фиксируют действия соответствующих лиц и не являются независимой проверкой оператором фактического ремонта или получения денег.'],
['Споры','Стороны сначала решают разногласия непосредственно. Они вправе обращаться в уполномоченные органы или суд в порядке, установленном законом. Платформа может предоставить предусмотренные законом сведения, но не обязана разрешать спор вместо суда или компетентного органа.'],
['Проверка личности','Отметка «Личность проверена» означает прохождение внутренней процедуры проверки документов, а не государственную сертификацию, лицензию или гарантию квалификации и качества ремонта.'],
['Персональные данные','Для работы платформы могут обрабатываться Telegram ID, телефон, имя, адрес, история заявок, актов и сообщений, а при добровольной идентификации — изображения документов и селфи. Данные используются для предоставления сервиса, поддержки, безопасности и исполнения законных обязанностей. Доступ ограничивается по ролям. Сроки хранения, способы удаления, сведения об операторе и законные основания обработки необходимо определить в отдельной полной политике конфиденциальности. Для обработки, требующей отдельного согласия, оно запрашивается отдельно.'],
['Изменения условий','При существенном изменении условий может потребоваться повторное подтверждение новой редакции. Дата и версия принятого документа фиксируются в системе.']
],uz:[
['Platformaning vazifasi','TehServis — buyurtmalar, muloqot, elektron dalolatnomalar va hisob-kitob vositalari uchun raqamli platforma. Operator mustaqil ustalar nomidan ta’mirlash ishlarini bajarmaydi, agar boshqacha aniq ko‘rsatilmagan bo‘lsa.'],
['Usta va mijoz','Ta’mirlash narxi, muddati, to‘lov va kafolat shartlari usta hamda mijoz o‘rtasida kelishiladi. Usta ish sifati, xavfsizligi, kafolat, soliq va qonuniy majburiyatlari uchun mustaqil javobgar.'],
['Operator javobgarligi','Operator mustaqil usta va mijoz o‘rtasidagi ta’mirlash shartnomasining tomoni emas va usta ishining natijasini kafolatlamaydi. Biroq operator o‘z xizmatlari va qonun bo‘yicha majburiyatlari uchun javobgar.'],
['Komissiya va depozit','Platformadan foydalanish pullik. Komissiya amaldagi tarif bo‘yicha dalolatnoma summasidan hisoblanadi. Ichki depozit platforma xizmatlari uchun avans va komissiyalarni hisobga olishga xizmat qiladi, mijozning ta’mirlash to‘lovi emas. Qolgan mablag‘ni qaytarish tartibi alohida e’lon qilinishi lozim.'],
['Dalolatnomalar va to‘lov','Elektron dalolatnoma foydalanuvchilar kiritgan ma’lumotlar asosida tuziladi. Tasdiqlash va «To‘langan» belgisi operator tomonidan ta’mirlash yoki to‘lov mustaqil tekshirilganini bildirmaydi.'],
['Nizolar','Usta va mijoz nizolarni o‘zaro yoki qonunda belgilangan tartibda vakolatli organlar va sud orqali hal qiladi.'],

['Shartlar o‘zgarishi','Muhim o‘zgarishlar uchun yangi tahrirga qayta rozilik so‘ralishi mumkin. Tasdiqlangan tahrir va vaqt tizimda qayd etiladi.']
