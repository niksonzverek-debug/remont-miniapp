<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

</head>
<body>
    <script>
        const params = new URLSearchParams(window.location.search);
        window.WEBAPP_SENDDATA_SUPPORTED = params.get('launch') === 'keyboard';
        if (!window.WEBAPP_SENDDATA_SUPPORTED) {
            document.body.innerHTML = '<main style="padding:24px;font:16px sans-serif;line-height:1.5"><h2>Откройте форму из чата с ботом</h2><p>Чтобы заявка отправилась, закройте это окно и нажмите «📝 Создать заявку» в клавиатуре чата с ботом.</p></main>';
        } else {
            document.write('<script src="js/common.js?v=20261013e"><\/script><script src="js/client.js?v=20261013e"><\/script>');
        }
    </script>
</body>
</html>
