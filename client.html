
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Регистрация клиента</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const isNewClient = params.get('new_client') === '1';

            if (isNewClient) {
                try {
                    // Удаляем только данные Remont BT.
                    for (const storage of [localStorage, sessionStorage]) {
                        const keys = [];

                        for (let i = 0; i < storage.length; i++) {
                            const key = storage.key(i);
                            if (key && key.startsWith('remont_bt_')) {
                                keys.push(key);
                            }
                        }

                        keys.forEach(key => storage.removeItem(key));
                    }

                    console.log('Remont BT: локальные данные очищены');
                } catch (e) {
                    console.error('Ошибка очистки локальных данных:', e);
                }
            }
        })();
    </script>
    <link rel="stylesheet" href="css/style.css?v=20261016d">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
    <script>
        const params = new URLSearchParams(window.location.search);
        window.WEBAPP_SENDDATA_SUPPORTED = params.get('launch') === 'keyboard';

        document.write(
            '<script src="js/common.js?v=20261016d"><\/script>' +
            '<script src="js/client.js?v=20261016d"><\/script>'
        );
    </script>
</body>
</html>
