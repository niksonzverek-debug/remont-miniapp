<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ТехСервис — заявка мастера</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071522;color:#ecf6ff;font:16px system-ui,-apple-system,sans-serif}main{max-width:520px;margin:auto;padding:24px 16px 45px}h1{font-size:23px;margin:8px 0 10px}p{color:#a7c5dc;line-height:1.45}.loc{padding:15px;border:1px solid #237eae;border-radius:14px;background:#0c2b43;margin:18px 0}label{display:block;margin:15px 0 5px;font-weight:600}input,textarea{display:block;width:100%;font:inherit;color:#fff;background:#102a40;border:1px solid #38617f;border-radius:11px;padding:13px;outline:none}input:focus,textarea:focus{border-color:#48b9ff}textarea{resize:vertical;min-height:90px}button{width:100%;margin-top:19px;padding:15px;border:0;border-radius:12px;background:#147ee4;color:white;font:700 16px system-ui}button:disabled{opacity:.5}.hint{font-size:13px;color:#91afc5}.error{color:#ff8b94;white-space:pre-wrap}</style></head><body><main><h1>🧰 Новая заявка</h1><p>Геолокация уже прикреплена. Все поля необязательные.</p><div class="loc">📍 Геолокация получена ботом</div><form id="order"><label for="phone">Номер телефона</label><input id="phone" type="tel" autocomplete="tel" placeholder="+998 90 123 45 67" maxlength="30"><label for="device">Вид техники</label><input id="device" placeholder="Стиральная машина" maxlength="120"><label for="brand">Марка техники</label><input id="brand" placeholder="Samsung" maxlength="120"><label for="problem">Что сломалось</label><textarea id="problem" maxlength="1200" placeholder="Описание неисправности"></textarea><label for="house">Дом</label><input id="house" maxlength="150" placeholder="Дом, подъезд, ориентир"><label for="apartment">Квартира</label><input id="apartment" maxlength="80" placeholder="Номер квартиры"><button id="save" type="submit">💾 Сохранить заявку</button><p id="error" class="error" role="alert"></p></form><p class="hint">Можно сохранить без заполнения. Заявка сразу получит статус «Принята».</p></main><script>
(function(){const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch(e){}const draft=new URLSearchParams(location.search).get('draft');const form=document.getElementById('order'),error=document.getElementById('error'),save=document.getElementById('save');if(!draft||!/^[a-f0-9]{16}$/.test(draft)){error.textContent='Черновик недействителен. Отправьте локацию боту повторно.';save.disabled=true;return;}form.addEventListener('submit',e=>{e.preventDefault();error.textContent='';const phone=document.getElementById('phone').value.trim();const digits=phone.replace(/\D/g,'');if(digits&&!(digits.length===9||digits.length===12&&digits.startsWith('998'))){error.textContent='Проверьте номер: 9 цифр или +998 и 9 цифр.';return;}if(!tg||typeof tg.sendData!=='function'){error.textContent='Откройте форму кнопкой в чате Telegram с ботом.';return;}const data={event:'master_location_order',draft_id:draft};for(const name of ['phone','device','brand','problem','house','apartment'])data[name]=document.getElementById(name).value.trim();save.disabled=true;try{tg.sendData(JSON.stringify(data))}catch(ex){save.disabled=false;error.textContent='Не удалось отправить заявку: '+ex.message;}})})();
</script></body></html>
