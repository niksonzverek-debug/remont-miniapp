<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Панель ремонта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Register the actual worker filename used by this project (sw.js).
      // This must be served over HTTPS (or localhost).
      (function () {
        if (!('serviceWorker' in navigator)) return;
        window.addEventListener('load', async function () {
          try {
            const workerUrl = new URL('./sw.js?release=20261018-initdata-hotfix1', document.baseURI);
            const scopeUrl = new URL('./', document.baseURI);
            const registration = await navigator.serviceWorker.register(workerUrl.href, {
              scope: scopeUrl.pathname,
              updateViaCache: 'none'
            });
            await registration.update();
            console.info('[Remont BT] SW registered:', registration.scope);
          } catch (error) {
            console.error('[Remont BT] SW registration failed:', error);
          }
        }, { once: true });
      })();
    </script>
    <link rel="stylesheet" href="css/style.css?v=20261018-initdata-hotfix1">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
    <script>
        const params = new URLSearchParams(window.location.search);
        const launchMode = params.get('launch') || 'main';
        const roleFromUrl = params.get('role');
        // sendData is available only when opened from a reply-keyboard WebApp button.
        window.WEBAPP_SENDDATA_SUPPORTED = launchMode === 'keyboard';
    </script>
    <script src="js/advertiser-config.js?v=20261018-initdata-hotfix1"></script>
    <script src="js/common.js?v=20261018-initdata-hotfix1"></script>
    <script>
        const MASTER_ID = 450540408;
        // Some Telegram WebView builds expose initData before initDataUnsafe.user.
        // Parse the signed initData payload as a compatibility fallback; never trust URL user IDs.
        let initDataUser = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
        if (!initDataUser && tg.initData) {
            try { const p = new URLSearchParams(tg.initData); const raw = p.get('user'); if (raw) initDataUser = JSON.parse(raw); } catch (e) { console.warn('Cannot parse Telegram initData user', e); }
        }
        const rawUserId = initDataUser ? initDataUser.id : null;
        const userId = rawUserId === null || rawUserId === undefined || rawUserId === ''
            ? null : Number(rawUserId);

        console.log('Mini App build 20261017masterorder2', {rawUserId, userId, roleFromUrl, launchMode});

        // Telegram sendData is available only from a reply-keyboard WebApp button.
        let role = null;
        if (roleFromUrl === 'master' || roleFromUrl === 'client') role = roleFromUrl;
        else if (Number.isFinite(userId)) role = userId === Number(MASTER_ID) ? 'master' : 'client';

        if (!role) {
            document.body.innerHTML = `<main style="padding:24px;font:16px sans-serif;line-height:1.5"><h2>Не удалось определить аккаунт Telegram</h2><p>Закройте это окно и откройте Mini App кнопкой в чате с ботом. Если вы уже открыли его из Telegram, полностью закройте Mini App и запустите снова. Не открывайте обычную HTTPS-ссылку в браузере.</p><p style="font-size:12px;opacity:.7">Техническая причина: Telegram не передал user в initData. Перезапуск и обновление приложения могут устранить устаревший кеш.</p></main>`;
        } else {
            const script = document.createElement('script');
            script.src = role === 'master' ? 'js/master.js?v=20261018-initdata-hotfix1' : 'js/client.js?v=20261018-initdata-hotfix1';
            script.onerror = () => { document.body.innerHTML = '<main style="padding:24px;font:16px sans-serif"><h2>Не удалось загрузить форму</h2><p>Проверьте публикацию файлов Mini App.</p></main>'; };
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
