<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Панель</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="css/style.css?v=20261013c">
</head>
<body>
    <script>
        const launchParams = new URLSearchParams(window.location.search);
        window.WEBAPP_SENDDATA_SUPPORTED = launchParams.get('launch') === 'keyboard';
    </script>
    <script src="js/common.js?v=20261013c"></script>
    <script>
        const MASTER_ID = 450540408;
        const params = new URLSearchParams(window.location.search);
        const userId = tg.initDataUnsafe?.user?.id;
        const roleFromButton = params.get('role');
        const keyboardLaunch = params.get('launch') === 'keyboard';

        console.log("Mini App build: 20261013c");
        console.log("User ID:", userId, "Master ID:", MASTER_ID,
                    "role:", roleFromButton, "keyboard:", keyboardLaunch);

        // Reply-keyboard URL explicitly selects the form. Bot handlers still
        // authorize actions by Telegram sender ID, so this is UI routing only.
        let role = null;
        if (keyboardLaunch && roleFromButton === 'master') {
            role = 'master';
        } else if (userId !== undefined && userId !== null && userId !== '') {
            role = Number(userId) === Number(MASTER_ID) ? 'master' : 'client';
        }

        if (!role) {
            document.body.innerHTML = `
                <main style="padding:24px;font:16px sans-serif;line-height:1.5">
                    <h2>Не удалось определить аккаунт Telegram</h2>
                    <p>Закройте приложение и откройте нужную форму кнопкой в чате с ботом.</p>
                    <p style="font-size:12px;opacity:.7">Код: USER_ID_MISSING · build 20261013c</p>
                </main>`;
        } else {
            const s = document.createElement('script');
            s.src = role === 'master' ? 'js/master.js?v=20261013c' : 'js/client.js?v=20261013c';
            s.onerror = () => {
                document.body.innerHTML = '<main style="padding:24px;font:16px sans-serif"><h2>Не удалось загрузить форму</h2><p>Обновите страницу и попробуйте снова.</p></main>';
            };
            document.body.appendChild(s);
        }
    </script>
</body>
</html>
