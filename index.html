<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Панель ремонта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Register the actual worker filename used by this project (sw.js).
      // This must be served over HTTPS (or localhost).
      (function () {
        if (!('serviceWorker' in navigator)) return;
        window.addEventListener('load', async function () {
          try {
            const workerUrl = new URL('./sw.js?release=20261018-registrationflow2', document.baseURI);
            const scopeUrl = new URL('./', document.baseURI);
            const registration = await navigator.serviceWorker.register(workerUrl.href, {
              scope: scopeUrl.pathname,
              updateViaCache: 'none'
            });
            await registration.update();
            console.info('[Remont BT] SW registered:', registration.scope);
          } catch (error) {
            console.error('[Remont BT] SW registration failed:', error);
          }
        }, { once: true });
      })();
    </script>
    <link rel="stylesheet" href="css/style.css?v=20261018-registrationflow2">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
    <script>
        const params = new URLSearchParams(window.location.search);
        // Master authentication no longer depends on query or fragment credentials.
        const hashParams = new URLSearchParams(String(window.location.hash || '').replace(/^#/, ''));
        const launchParam = (name) => params.get(name) || hashParams.get(name) || '';
        const launchMode = launchParam('launch') || 'main';
        const roleFromUrl = launchParam('role');
        // sendData is available only when opened from a reply-keyboard WebApp button.
        window.WEBAPP_SENDDATA_SUPPORTED = launchMode === 'keyboard';
    </script>
    <script src="js/advertiser-config.js?v=20261018-registrationflow2"></script>
    <script src="js/common.js?v=20261018-registrationflow2"></script>
    <script>
        const rawUserId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id ?? null;
        const userId = rawUserId === null || rawUserId === undefined || rawUserId === '' ? null : Number(rawUserId);
        // index.html is the master entry point. Missing query/initData now leads to code login, not a dead-end error.
        const role = roleFromUrl === 'client' ? 'client' : 'master';
        console.info('[Remont BT] login-code build 20261018', {
            path: window.location.pathname,
            queryKeys: Array.from(params.keys()),
            hashKeys: Array.from(hashParams.keys()),
            initDataPresent: Boolean(window.Telegram?.WebApp?.initData),
            initUserPresent: Number.isFinite(userId)
        });
        const script = document.createElement('script');
        script.src = role === 'master' ? 'js/master.js?v=20261018-registrationflow2' : 'js/client.js?v=20261018-registrationflow2';
        script.onerror = () => { document.body.innerHTML = '<main style="padding:24px;font:16px sans-serif"><h2>Не удалось загрузить приложение</h2><p>Проверьте публикацию файлов Mini App.</p></main>'; };
        document.body.appendChild(script);
    </script>
</body>
</html>
