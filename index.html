<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Панель ремонта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=20261013g">
</head>
<body>
    <script>
        const params = new URLSearchParams(window.location.search);
        const launchMode = params.get('launch') || 'main';
        const roleFromUrl = params.get('role');
        // sendData is available only when opened from a reply-keyboard WebApp button.
        window.WEBAPP_SENDDATA_SUPPORTED = launchMode === 'keyboard';
    </script>
    <script src="js/common.js?v=20261013g"></script>
    <script>
        const MASTER_ID = 450540408;
        const rawUserId = tg.initDataUnsafe && tg.initDataUnsafe.user
            ? tg.initDataUnsafe.user.id : null;
        const userId = rawUserId === null || rawUserId === undefined || rawUserId === ''
            ? null : Number(rawUserId);

        console.log('Mini App build 20261013g', {rawUserId, userId, roleFromUrl, launchMode});

        // Telegram sendData is available only from a reply-keyboard WebApp button.
        if (launchMode !== 'keyboard') {
            document.body.innerHTML = `
                <main style="padding:24px;font:16px sans-serif;line-height:1.5">
                    <h2>Откройте рабочую форму из чата с ботом</h2>
                    <p>Кнопка «Открыть» в меню Telegram не передаёт заполненную форму боту.</p>
                    <p>Закройте это окно и нажмите «📝 Создать заявку» или «📝 Открыть форму» в клавиатуре чата с ботом.</p>
                </main>`;
        } else {
        let role = null;
        // Reply-keyboard buttons include a role marker so the form still opens if Telegram's
        // unsafe user object is temporarily unavailable. Bot handlers independently authorize actions.
        if (launchMode === 'keyboard' && (roleFromUrl === 'master' || roleFromUrl === 'client')) {
            role = roleFromUrl;
        } else if (Number.isFinite(userId)) {
            role = userId === Number(MASTER_ID) ? 'master' : 'client';
        }

        if (!role) {
            document.body.innerHTML = `
                <main style="padding:24px;font:16px sans-serif;line-height:1.5">
                    <h2>Не удалось определить аккаунт Telegram</h2>
                    <p>Закройте Mini App и откройте его заново из чата с ботом.</p>
                    <p>Если ошибка повторяется, откройте форму кнопкой в клавиатуре бота.</p>
                    <p style="font-size:12px;opacity:.7">USER_ID_MISSING · build 20261013g</p>
                </main>`;
        } else {
            const script = document.createElement('script');
            script.src = role === 'master'
                ? 'js/master.js?v=20261013g'
                : 'js/client.js?v=20261013g';
            script.onerror = () => {
                document.body.innerHTML = '<main style="padding:24px;font:16px sans-serif"><h2>Не удалось загрузить форму</h2><p>Проверьте публикацию GitHub Pages и откройте приложение повторно.</p></main>';
            };
            document.body.appendChild(script);
        }
        }
    </script>
</body>
</html>
