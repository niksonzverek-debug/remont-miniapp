<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Панель ремонта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Register the actual worker filename used by this project (sw.js).
      // This must be served over HTTPS (or localhost).
      (function () {
        if (!('serviceWorker' in navigator)) return;
        window.addEventListener('load', async function () {
          try {
            const workerUrl = new URL('./sw.js?release=20261020-master-flow-fix6', document.baseURI);
            const scopeUrl = new URL('./', document.baseURI);
            const registration = await navigator.serviceWorker.register(workerUrl.href, {
              scope: scopeUrl.pathname,
              updateViaCache: 'none'
            });
            await registration.update();
            console.info('[Remont BT] SW registered:', registration.scope);
          } catch (error) {
            console.error('[Remont BT] SW registration failed:', error);
          }
        }, { once: true });
      })();
    </script>
    <link rel="stylesheet" href="css/style.css?v=20261020-electric-steel-v1">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
    <script>
        const params = new URLSearchParams(window.location.search);
        const launchMode = params.get('launch') || 'main';
        const roleFromUrl = params.get('role');
        // sendData is available only when opened from a reply-keyboard WebApp button.
        window.WEBAPP_SENDDATA_SUPPORTED = launchMode === 'keyboard';
    </script>
    <script src="js/advertiser-config.js?v=20261020-master-flow-fix6"></script>
    <script src="js/common.js?v=20261020-master-flow-fix6"></script>
    <script>
        const MASTER_ID = 450540408;
        const rawUserId = tg.initDataUnsafe && tg.initDataUnsafe.user
            ? tg.initDataUnsafe.user.id : null;
        const userId = rawUserId === null || rawUserId === undefined || rawUserId === ''
            ? null : Number(rawUserId);
        const hasMasterSession = Boolean(params.get('master_uid') && params.get('master_exp') && params.get('master_sig'));

        console.log('Mini App build 20261020-master-flow-fix6', {rawUserId, userId, roleFromUrl, launchMode, hasMasterSession});

        // The master URL is signed server-side and checked by the API. Never invent an identity client-side.
        let role = null;
        if (roleFromUrl === 'master' && hasMasterSession) role = 'master';
        else if ((roleFromUrl === 'master' || roleFromUrl === 'client') && Number.isFinite(userId)) role = roleFromUrl;
        else if (Number.isFinite(userId)) role = userId === Number(MASTER_ID) ? 'master' : 'client';

        if (!role) {
            document.body.innerHTML = `<main style="padding:24px;font:16px sans-serif;line-height:1.5"><h2>Не удалось определить аккаунт Telegram</h2><p>Закройте Mini App. В чате с ботом отправьте /start и откройте приложение новой кнопкой «Открыть кабинет мастера». Если кнопки нет, перезапустите бота. Не открывайте обычную HTTPS-ссылку.</p><p style="opacity:.7">Техническая причина: в ссылке запуска нет подписанной сессии мастера, а Telegram не передал user в initData.</p></main>`;
        } else {
            const script = document.createElement('script');
            script.src = role === 'master' ? 'js/master.js?v=20261020-master-flow-fix6' : 'js/client.js?v=20261020-master-flow-fix6';
            script.onerror = () => { document.body.innerHTML = '<main style="padding:24px;font:16px sans-serif"><h2>Не удалось загрузить форму</h2><p>Проверьте публикацию файлов Mini App.</p></main>'; };
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
